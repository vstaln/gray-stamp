[package]
name = "gray-stamp"
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Per-session timing ledger: tool-call and turn durations, /stamps table"

[[bin]]
name = "gray-stamp"
path = "src/main.rs"

[lib]
name = "gray_stamp"
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
